name: Validate changes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: []

permissions:
  contents: read

jobs:
  validate:
    name: Validate Changes (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}, ${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.19.1", "1.20.2"]
        otp: ["27.2", "28.5"]
        adapter: ["postgres", "sqlite"]
        # 1.17.3 has no OTP 28 build, so the floor legs go here rather than on the axis.
        # OTP 26 stays covered: mix.exs declares no OTP floor and 1.17 supports 25-27.
        include:
          - elixir: "1.17.3"
            otp: "27.2"
            adapter: "postgres"
          - elixir: "1.17.3"
            otp: "27.2"
            adapter: "sqlite"
          - elixir: "1.17.3"
            otp: "26.0.1"
            adapter: "postgres"
          - elixir: "1.17.3"
            otp: "26.0.1"
            adapter: "sqlite"
    services:
       pg:
        image: postgres:15.2
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
    - name: Install dependencies
      run: mix deps.get
    - name: Validate Changes
      run: make all
      env:
        NOPASS_ADAPTER: ${{ matrix.adapter }}
